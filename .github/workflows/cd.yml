name: CD (Deploy on MacBook Docker Desktop)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "GHCR image tag to deploy"
        required: true
        type: string
        default: "latest"
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: cd-main
  cancel-in-progress: true

env:
  IMAGE_NAME: mlops-catsdogs

permissions:
  contents: read
  packages: read

jobs:
  deploy-to-macbook:
    name: Deploy to MacBook Docker Desktop
    if: >-
      ${{
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        github.event_name == 'workflow_dispatch'
      }}
    runs-on: [self-hosted, macOS]
    environment:
      name: macbook-docker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine image tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            TAG="sha-${{ github.event.workflow_run.head_sha }}"
          else
            TAG="${{ github.event.inputs.image_tag }}"
          fi
          OWNER_LOWER=$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          REPO_LOWER=$(printf '%s' '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${OWNER_LOWER}/${REPO_LOWER}:${TAG}" >> "$GITHUB_ENV"
          echo "Deploying ghcr.io/${OWNER_LOWER}/${REPO_LOWER}:${TAG}"

      - name: Verify MacBook Docker Desktop
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: $(hostname)"
          echo "Architecture: $(uname -m)"
          echo "Working directory: $PWD"
          docker version
          docker compose version

      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username '${{ github.repository_owner }}' \
            --password-stdin

      - name: Pull exact CI image
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$IMAGE"

      - name: Deploy immutable CI image with Docker Compose
        shell: bash
        run: |
          set -euo pipefail
          export IMAGE TAG
          docker compose -f docker/docker-compose.deploy.yml down --remove-orphans || true
          docker compose -f docker/docker-compose.deploy.yml up -d --no-build --remove-orphans
          docker compose -f docker/docker-compose.deploy.yml ps

      - name: Wait for service health
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/wait_for.sh http://127.0.0.1:8000/health 120

      - name: Smoke test deployed service
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/smoke_test.sh http://127.0.0.1:8000
          curl -fsS http://127.0.0.1:8501/ > /dev/null

      - name: Verify self-contained dashboard evidence
        shell: bash
        run: |
          set -euo pipefail
          docker exec mlops-catsdogs-ui-1 python -c "from pathlib import Path; required=['/app/artifacts/model.pkl','/app/artifacts/metrics/history.json','/app/artifacts/metrics/baseline.json','/app/artifacts/metrics/promotion.json','/app/artifacts/model_card.md','/app/docker/docker-compose.yml','/app/.github/workflows/ci.yml','/app/.github/workflows/cd.yml']; missing=[p for p in required if not Path(p).exists()]; raise SystemExit('Missing: '+', '.join(missing) if missing else 0)"

      - name: Write deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "## MacBook Docker Deployment"
            echo ""
            echo "- **Environment:** macbook-docker"
            echo "- **Image:** \`$IMAGE\`"
            echo "- **Architecture:** $(uname -m)"
            echo "- **API:** http://localhost:8000"
            echo "- **UI:** http://localhost:8501"
            echo "- **Model checkpoint:** /app/artifacts/model.pkl"
            echo "- **Dashboard evidence:** history, promotion, plots, run records, CI/CD and Docker manifests baked into image"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect deployment logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-logs
          docker compose -f docker/docker-compose.deploy.yml ps > deploy-logs/ps.txt 2>&1 || true
          docker compose -f docker/docker-compose.deploy.yml logs --no-color --tail=500 > deploy-logs/compose-logs.txt 2>&1 || true
          tail -40 deploy-logs/compose-logs.txt || true

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macbook-deployment-evidence
          path: deploy-logs/
          retention-days: 14

# MacBook prerequisites:
# - GitHub Actions runner labels must include: self-hosted, macOS
# - Docker Desktop must be running
# - Runner user must be able to run docker/docker compose without sudo
# - No SSH is required: this job executes directly on the MacBook self-hosted runner.
# - GHCR_PAT is only needed if the package is private and GITHUB_TOKEN cannot read it.
