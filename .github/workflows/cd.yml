name: CD (Deploy on MacBook Docker Desktop)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "GHCR image tag to deploy"
        required: true
        type: string
        default: "latest"
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: cd-main
  cancel-in-progress: true

env:
  IMAGE_NAME: mlops-catsdogs

permissions:
  contents: read
  packages: read

jobs:
  deploy-to-macbook:
    name: Deploy to MacBook Docker Desktop
    if: >-
      ${{
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        github.event_name == 'workflow_dispatch'
      }}
    runs-on: [self-hosted, macOS]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine image tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            TAG="sha-${{ github.event.workflow_run.head_sha }}"
          else
            TAG="${{ github.event.inputs.image_tag }}"
          fi
          OWNER_LOWER=$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          REPO_LOWER=$(printf '%s' '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${OWNER_LOWER}/${REPO_LOWER}:${TAG}" >> "$GITHUB_ENV"
          echo "Deploying ghcr.io/${OWNER_LOWER}/${REPO_LOWER}:${TAG}"

      - name: Verify MacBook Docker Desktop
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: $(hostname)"
          echo "Working directory: $PWD"
          docker version
          docker compose version

      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username '${{ github.repository_owner }}' \
            --password-stdin

      - name: Pull exact CI image
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$IMAGE"

      - name: Deploy with Docker Compose
        shell: bash
        env:
          DEPLOY_DIR: ${{ secrets.NAVEEN_COMPOSE_DIR }}
        run: |
          set -euo pipefail
          DEPLOY_DIR="${DEPLOY_DIR:-$HOME/mlops-catsdogs}"
          echo "Deploy directory: $DEPLOY_DIR"
          test -d "$DEPLOY_DIR"
          cd "$DEPLOY_DIR"

          # Compose must use the exact image built by CI.
          export IMAGE="$IMAGE"
          export TAG="$TAG"

          docker compose -f docker/docker-compose.yml down --remove-orphans || true
          docker compose -f docker/docker-compose.yml up -d --no-build --remove-orphans
          docker compose -f docker/docker-compose.yml ps

      - name: Wait for service health
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/wait_for.sh http://127.0.0.1:8000/health 120

      - name: Smoke test deployed service
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/smoke_test.sh http://127.0.0.1:8000

      - name: Collect deployment logs
        if: always()
        shell: bash
        env:
          DEPLOY_DIR: ${{ secrets.NAVEEN_COMPOSE_DIR }}
        run: |
          set -euo pipefail
          DEPLOY_DIR="${DEPLOY_DIR:-$HOME/mlops-catsdogs}"
          mkdir -p "$GITHUB_WORKSPACE/deploy-logs"
          cd "$DEPLOY_DIR" || true
          docker compose -f docker/docker-compose.yml ps > "$GITHUB_WORKSPACE/deploy-logs/ps.txt" 2>&1 || true
          docker compose -f docker/docker-compose.yml logs --no-color --tail=500 > "$GITHUB_WORKSPACE/deploy-logs/compose-logs.txt" 2>&1 || true
          tail -40 "$GITHUB_WORKSPACE/deploy-logs/compose-logs.txt" || true

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macbook-deployment-evidence
          path: deploy-logs/
          retention-days: 14

# MacBook prerequisites:
# - GitHub Actions runner labels must include: self-hosted, macOS
# - Docker Desktop must be running
# - Runner user must be able to run docker/docker compose without sudo
# - NAVEEN_COMPOSE_DIR should point to the checked-out repository on the MacBook
#   (or omit it to use ~/mlops-catsdogs)
# - GHCR_PAT is only needed if the GHCR package is private and GITHUB_TOKEN
#   cannot read it; give it read:packages permission.
# - docker/docker-compose.yml should use the IMAGE variable, e.g.:
#     image: ${IMAGE:-mlops-catsdogs:local}
#   and should not build the deployment service when CD uses --no-build.