name: CD (Compose)

on:
  push:
    branches: [main-l]
    paths:
      - "src/**"
      - "docker/**"
      - "configs/**"
      - ".github/workflows/cd.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy"
        type: string
        default: local
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

concurrency:
  # One deployment at a time; a superseded run is cancelled rather than racing.
  group: cd-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: mlops-catsdogs
  TAG: ${{ github.event.inputs.image_tag || 'local' }}
  NAMESPACE: mlops
  PYTHON_VERSION: "3.11"

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Deploy with Docker Compose
    # Run on pushes or manual dispatch, and when triggered by the CI workflow
    # completing successfully.
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.name == 'CI') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Determine image to deploy
        id: image
        run: |
          echo "GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME"
          # Lowercase the repository owner and repo name to satisfy Docker reference rules.
          OWNER="${{ github.repository_owner }}"
          OWNER_LOWER=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          REPO="${{ github.event.repository.name }}"
          REPO_LOWER=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')

          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            # Inspect the workflow_run payload to see which event triggered CI
            # (push vs pull_request). Only attempt to pull the CI-built image
            # for push events; for PRs the CI job usually won't push the image.
            if command -v jq >/dev/null 2>&1 && [ -f "$GITHUB_EVENT_PATH" ]; then
              CI_EVENT=$(jq -r '.workflow_run.event // ""' "$GITHUB_EVENT_PATH")
            else
              CI_EVENT=""
            fi
            echo "CI workflow event: $CI_EVENT"
            if [ "$CI_EVENT" = "push" ]; then
              TAG=sha-${{ github.event.workflow_run.head_sha }}
              echo "Triggered by CI push run; using image tag $TAG"
            else
              TAG=local
              echo "Triggered by CI run from $CI_EVENT; falling back to local tag"
            fi
          elif [ -n "${{ github.event.inputs.image_tag || '' }}" ]; then
            TAG=${{ github.event.inputs.image_tag }}
            echo "Using requested image tag $TAG"
          else
            TAG=local
            echo "No image tag requested; using local"
          fi

          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "OWNER_LOWER=$OWNER_LOWER" >> $GITHUB_ENV
          echo "IMAGE=ghcr.io/$OWNER_LOWER/$REPO_LOWER:$TAG" >> $GITHUB_ENV
          # Export whether we're using a local tag so later steps can conditionally build
          if [ "$TAG" = "local" ]; then
            echo "is_local=true" >> $GITHUB_OUTPUT
          else
            echo "is_local=false" >> $GITHUB_OUTPUT
          fi

      - name: Pull image (if not local) and run with Docker Compose
        run: |
          set -euo pipefail
          echo "IMAGE=$IMAGE" ; echo "TAG=$TAG"
          if [ "$TAG" != "local" ]; then
            if [ -n "${{ secrets.GHCR_PAT || '' }}" ]; then
              echo "Logging into ghcr.io"
              echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "$OWNER_LOWER" --password-stdin || true
            fi
            echo "Pulling $IMAGE"
            docker pull "$IMAGE" || true
            docker tag "$IMAGE" mlops-catsdogs:local || true
            echo "Using pulled image; starting compose without build"
            docker compose -f docker/docker-compose.yml up -d --no-build
          else
            echo "Local tag requested; starting compose (may build)"
            docker compose -f docker/docker-compose.yml up -d --build
          fi

          bash scripts/wait_for.sh http://127.0.0.1:8000/health 120

      - name: Smoke test the deployed service
        run: |
          bash scripts/smoke_test.sh http://127.0.0.1:8000
          python -m mlops.cli perf-check --endpoint http://127.0.0.1:8000 --sample-size 40

      - name: Collect compose logs
        if: always()
        run: |
          mkdir -p deploy-logs
          docker compose -f docker/docker-compose.yml ps > deploy-logs/ps.txt 2>&1 || true
          docker compose -f docker/docker-compose.yml logs --no-color --tail=500 > deploy-logs/compose-logs.txt 2>&1 || true
          tail -40 deploy-logs/compose-logs.txt || true

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-evidence
          path: |
            deploy-logs/
            artifacts/metrics/
          retention-days: 14

  deploy-to-naveen-macbook-air:
    name: Deploy to naveen-macbook-air (self-hosted)
    needs: deploy
    runs-on: self-hosted
    if: github.event.inputs.image_tag != 'skip'
    steps:
      - uses: actions/checkout@v4

      - name: Build image (no push)
        run: |
          set -euo pipefail
          docker build -t mlops-catsdogs:local -f docker/Dockerfile .

      - name: Deploy on naveen-macbook-air (local runner)
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          OWNER_LOWER=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          IMAGE=ghcr.io/$OWNER_LOWER/${{ env.IMAGE }}:${{ env.TAG }}
          echo "IMAGE=$IMAGE"
          if [ -n "${{ secrets.GHCR_PAT || '' }}" ]; then
            echo "Logging into ghcr.io"
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "$OWNER_LOWER" --password-stdin || true
          fi
          if [ "${{ env.TAG }}" != "local" ]; then
            echo "Tagging and pushing $IMAGE"
            docker tag mlops-catsdogs:local "$IMAGE" || true
            docker push "$IMAGE" || true
            docker pull "$IMAGE" || true
            docker tag "$IMAGE" mlops-catsdogs:local || true
          else
            echo "Using local image"
          fi
          DEPLOY_DIR="${{ secrets.NAVEEN_COMPOSE_DIR }}"
          if [ -z "$DEPLOY_DIR" ]; then
            DEPLOY_DIR=~/mlops-catsdogs
          fi
          echo "Changing to $DEPLOY_DIR"
          cd "$DEPLOY_DIR" || true
          echo "Updating compose stack"
          docker compose -f docker/docker-compose.yml pull || true
          docker compose -f docker/docker-compose.yml up -d --remove-orphans
          docker compose -f docker/docker-compose.yml ps

      - name: Upload deploy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naveen-deploy-log
          path: |
            deploy-logs/
          retention-days: 7

# Notes: this job is intended to run on a self-hosted runner registered as
# `naveen-macbook-air` (ensure the runner labels include `self-hosted` and that
# the runner can reach GHCR). Repository secrets you may want to set:
# - GHCR_PAT: Personal access token with `read:packages` (required if packages are private)
# - NAVEEN_COMPOSE_DIR: path to the repository on the runner (defaults to ~/mlops-catsdogs)
