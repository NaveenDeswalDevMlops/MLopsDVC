# Continuous deployment to a local minikube cluster.
#
# Two ways to run this, and the distinction matters:
#
# 1. **self-hosted runner** (the real deployment). A runner registered on the
#    machine that owns the minikube cluster applies the manifests to *that*
#    cluster, and the deployment outlives the workflow. This is the default when
#    `deploy_target: self-hosted` is chosen.
#
# 2. **hosted runner** (verification only). A GitHub-hosted runner starts a
#    throwaway minikube, deploys into it, smoke tests it and then the whole VM is
#    destroyed. That proves the manifests, image and rollout are correct; it does
#    not leave anything running.
#
# The second is what runs by default because it needs no infrastructure, and it is
# labelled as verification rather than presented as a deployment — a pipeline that
# reports "deployed" after tearing down the cluster is worse than no pipeline,
# because it manufactures confidence rather than evidence.
#
# The trigger is a plain `push` to main plus `workflow_dispatch`, deliberately not
# `workflow_run` chained to CI: a chained trigger only fires when the workflow file
# already exists on the default branch, which is exactly when someone setting the
# project up for the first time will conclude that CD is broken.

name: CD (Compose)

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "docker/**"
      - "configs/**"
      - ".github/workflows/cd.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy"
        type: string
        default: local

concurrency:
  # One deployment at a time; a superseded run is cancelled rather than racing.
  group: cd-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: mlops-catsdogs
  TAG: ${{ github.event.inputs.image_tag || 'local' }}
  NAMESPACE: mlops
  PYTHON_VERSION: "3.11"

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Deploy with Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train the model
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -m mlops.cli generate-data --per-class 250
          python -m mlops.cli preprocess
          python -m mlops.cli train
          python -m mlops.cli evaluate
          python -m mlops.cli promote

      - name: Build and run with Docker Compose
        run: |
          docker compose -f docker/docker-compose.yml up --build -d
          bash scripts/wait_for.sh http://127.0.0.1:8000/health 120

      - name: Smoke test the deployed service
        run: |
          bash scripts/smoke_test.sh http://127.0.0.1:8000
          python -m mlops.cli perf-check --endpoint http://127.0.0.1:8000 --sample-size 40

      - name: Collect compose logs
        if: always()
        run: |
          mkdir -p deploy-logs
          docker compose -f docker/docker-compose.yml ps > deploy-logs/ps.txt 2>&1 || true
          docker compose -f docker/docker-compose.yml logs --no-color --tail=500 > deploy-logs/compose-logs.txt 2>&1 || true
          tail -40 deploy-logs/compose-logs.txt || true

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-evidence
          path: |
            deploy-logs/
            artifacts/metrics/
          retention-days: 14

  deploy-to-naveen-macbook-air:
    name: Deploy to naveen-macbook-air (self-hosted)
    needs: deploy
    runs-on: self-hosted
    if: github.event.inputs.image_tag != 'skip'
    steps:
      - uses: actions/checkout@v4

      - name: Build and push image to GHCR
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE }}:${{ env.TAG }}

      - name: Deploy on naveen-macbook-air (local runner)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE }}:${{ env.TAG }}
        run: |
          set -euo pipefail
          echo "Pulling $IMAGE"
          if [ -n "${{ secrets.GHCR_PAT || '' }}" ]; then
            echo "Logging into ghcr.io"
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin || true
          fi
          docker pull "$IMAGE" || true
          echo "Tagging to mlops-catsdogs:local for Compose"
          docker tag "$IMAGE" mlops-catsdogs:local || true
          DEPLOY_DIR="${{ secrets.NAVEEN_COMPOSE_DIR }}"
          if [ -z "$DEPLOY_DIR" ]; then
            DEPLOY_DIR=~/mlops-catsdogs
          fi
          echo "Changing to $DEPLOY_DIR"
          cd "$DEPLOY_DIR" || true
          echo "Updating compose stack"
          docker compose -f docker/docker-compose.yml pull || true
          docker compose -f docker/docker-compose.yml up -d --remove-orphans
          docker compose -f docker/docker-compose.yml ps

      - name: Upload deploy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naveen-deploy-log
          path: |
            deploy-logs/
          retention-days: 7

# Notes: this job is intended to run on a self-hosted runner registered as
# `naveen-macbook-air` (ensure the runner labels include `self-hosted` and that
# the runner can reach GHCR). Repository secrets you may want to set:
# - GHCR_PAT: Personal access token with `read:packages` (required if packages are private)
# - NAVEEN_COMPOSE_DIR: path to the repository on the runner (defaults to ~/mlops-catsdogs)
