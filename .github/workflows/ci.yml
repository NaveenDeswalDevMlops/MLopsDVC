# Continuous integration: lint, test, run the pipeline, build the image, publish it.
#
# The job order encodes what is worth failing fast on. Lint and tests run first
# because they are seconds; the pipeline runs next because an image containing a
# model that failed its own accuracy gate should never be built; the image is built
# last and only pushed from the default branch.
#
# The image is built *after* training so the checkpoint is baked into it, which is
# what makes the published artifact self-contained: pull the tag, run it, get
# predictions, with no volume to mount and no model to download at start-up.

name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: "3.11"

permissions:
  contents: read

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src tests

      - name: Run tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          pytest tests -q \
            --cov=src/mlops \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=70

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  pipeline:
    name: Train, evaluate and gate
    runs-on: ubuntu-latest
    needs: quality
    outputs:
      accuracy: ${{ steps.gate.outputs.accuracy }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The synthetic generator keeps CI free of Kaggle credentials and an 800 MB
      # download. Point this at `make data-kaggle` with a KAGGLE_KEY secret to run
      # the real archive instead.
      - name: Generate dataset
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m mlops.cli generate-data --per-class 250

      - name: Preprocess
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m mlops.cli preprocess

      - name: Train
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m mlops.cli train

      - name: Evaluate
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m mlops.cli evaluate

      # A non-zero exit here fails the build, so a model below the accuracy floor
      # never reaches the image-build job.
      - name: Apply the promotion gate
        id: gate
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -m mlops.cli promote
          accuracy=$(python -c "import json;print(json.load(open('artifacts/metrics/baseline.json'))['metrics']['accuracy'])")
          echo "accuracy=$accuracy" >> "$GITHUB_OUTPUT"
          echo "### Model gate passed — test accuracy \`$accuracy\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Start the API and smoke test it
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -m mlops.cli serve-api --port 8000 &
          echo $! > api.pid
          bash scripts/wait_for.sh http://127.0.0.1:8000/health 40
          bash scripts/smoke_test.sh http://127.0.0.1:8000
          python -m mlops.cli perf-check --endpoint http://127.0.0.1:8000 --sample-size 40
          kill "$(cat api.pid)"

      # The trained model is handed to the build job as an artifact rather than
      # retrained there, so the image contains exactly the weights that just passed
      # the gate and the smoke test.
      - name: Upload model and metrics
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            artifacts/model.pkl
            artifacts/model_card.md
            artifacts/metrics/
            artifacts/plots/
          retention-days: 30

  image:
    name: Build and publish the image
    runs-on: ubuntu-latest
    needs: pipeline
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download the trained model
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: artifacts

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        # Pull requests from forks have no package-write token, so the image is
        # built to verify the Dockerfile but not pushed.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Verify the built image actually serves before it is published. A container
      # that fails its own health check must not become the "latest" tag.
      - name: Smoke test the image
        run: |
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          docker run -d --name catsdogs -p 8000:8000 "$IMAGE"
          bash scripts/wait_for.sh http://127.0.0.1:8000/health 60
          curl -fsS http://127.0.0.1:8000/ready
          curl -fsS http://127.0.0.1:8000/model-info
          docker rm -f catsdogs

      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
