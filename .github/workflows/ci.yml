# Continuous integration: lint, test, run the pipeline, build the image, publish it.
# The final image contains the model, evaluation evidence, experiment run records,
# dataset manifest and deployment metadata so the dashboard is self-contained.
name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: "3.11"

permissions:
  contents: read

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src tests
      - name: Run tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          pytest tests -q \
            --cov=src/mlops \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=70
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  pipeline:
    name: Train, evaluate and gate
    runs-on: ubuntu-latest
    needs: quality
    outputs:
      accuracy: ${{ steps.gate.outputs.accuracy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Reproduce DVC pipeline (if present)
        if: ${{ always() }}
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          if [ -f dvc.yaml ]; then
            dvc repro || true
            dvc push || true
          fi
      - name: Generate dataset
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m mlops.cli generate-data --per-class 250
      - name: Preprocess
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m mlops.cli preprocess
      - name: Train
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m mlops.cli train
      - name: Evaluate
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m mlops.cli evaluate
      - name: Apply the promotion gate
        id: gate
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -m mlops.cli promote
          accuracy=$(python -c "import json;print(json.load(open('artifacts/metrics/baseline.json'))['metrics']['accuracy'])")
          echo "accuracy=$accuracy" >> "$GITHUB_OUTPUT"
          echo "### Model gate passed — test accuracy \`$accuracy\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Start the API and smoke test it
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -m mlops.cli serve-api --port 8000 &
          echo $! > api.pid
          bash scripts/wait_for.sh http://127.0.0.1:8000/health 60
          bash scripts/smoke_test.sh http://127.0.0.1:8000
          python -m mlops.cli perf-check --endpoint http://127.0.0.1:8000 --sample-size 40
          kill "$(cat api.pid)"
      - name: Upload model, metrics, runs and dataset evidence
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            artifacts/model.pkl
            artifacts/model_card.md
            artifacts/metrics/
            artifacts/plots/
            artifacts/runs/
            data/
          retention-days: 30
      - name: Package submission zip (source, configs, artifacts)
        run: |
          set -e
          mkdir -p submission
          zip -r submission/mlops_assignment2_submission.zip \
            src docker k8s .github dvc.yaml dvc.lock requirements.txt requirements-dev.txt README.md artifacts mlruns || true
      - name: Upload submission
        uses: actions/upload-artifact@v4
        with:
          name: submission-zip
          path: submission/mlops_assignment2_submission.zip
          retention-days: 30

  image:
    name: Build and publish the image
    runs-on: ubuntu-latest
    needs: pipeline
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Download trained model and dashboard evidence
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: .
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to the registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}
      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build validation image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true
      - name: Smoke test the image and dashboard
        run: |
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          docker run -d --name catsdogs -p 8000:8000 -p 8501:8501 "$IMAGE"
          bash scripts/wait_for.sh http://127.0.0.1:8000/health 60
          curl -fsS http://127.0.0.1:8000/ready
          curl -fsS http://127.0.0.1:8000/model-info
          docker exec catsdogs python -c "from pathlib import Path; assert Path('/app/artifacts/metrics/history.json').is_file(); assert Path('/app/artifacts/metrics/promotion.json').is_file(); assert Path('/app/artifacts/plots').glob('*.png'); assert Path('/app/.github/workflows/ci.yml').is_file(); assert Path('/app/docker/docker-compose.yml').is_file()"
          docker rm -f catsdogs
      - name: Scan for vulnerabilities
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          IMAGE_LOWER=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --format table \
            --exit-code 1 \
            --ignore-unfixed \
            --severity CRITICAL,HIGH \
            "$IMAGE_LOWER"
      - name: Push multi-platform image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
