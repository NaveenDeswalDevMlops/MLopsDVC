# Continuous integration: lint, test, run the pipeline, build the image, publish it.
#
# The job order encodes what is worth failing fast on. Lint and tests run first
# because they are seconds; the pipeline runs next because an image containing a
# model that failed its own accuracy gate should never be built; the image is built
# last and only pushed from the default branch.
#
# The image is built *after training* so the checkpoint is baked into it, which is
# what makes the published artifact self-contained: pull the tag, run it, get
# predictions, with no volume to mount and no model to download at start-up.

name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: "3.11"

permissions:
  contents: read

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src tests

      - name: Run tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          pytest tests -q \
            --cov=src/mlops \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=70

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  pipeline:
    name: Train, evaluate and gate
    runs-on: ubuntu-latest
    needs: quality
    outputs:
      accuracy: ${{ steps.gate.outputs.accuracy }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Reproduce DVC pipeline (if present)
        if: ${{ always() }}
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          if [ -f dvc.yaml ]; then
            echo "Found dvc.yaml — running dvc repro && dvc push (local remote)"
            dvc repro || true
            dvc push || true
          else
            echo "No dvc.yaml, skipping dvc repro"
          fi

      # The synthetic generator keeps CI free of Kaggle credentials and an 800 MB
      # download. Point this at `make data-kaggle` with a KAGGLE_KEY secret to run
      # the real archive instead.
      - name: Generate dataset
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m mlops.cli generate-data --per-class 250

      - name: Preprocess
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m mlops.cli preprocess

      - name: Train
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m mlops.cli train

      - name: Evaluate
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m mlops.cli evaluate

      # A non-zero exit here fails the build, so a model below the accuracy floor
      # never reaches the image-build job.
      - name: Apply the promotion gate
        id: gate
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -m mlops.cli promote
          accuracy=$(python -c "import json;print(json.load(open('artifacts/metrics/baseline.json'))['metrics']['accuracy'])")
          echo "accuracy=$accuracy" >> "$GITHUB_OUTPUT"
          echo "### Model gate passed — test accuracy \`$accuracy\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Start the API and smoke test it
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -m mlops.cli serve-api --port 8000 &
          echo $! > api.pid

          # Wait for the HTTP health endpoint first (short timeout)
          bash scripts/wait_for.sh http://127.0.0.1:8000/health 60

          # Ensure the service reports ready+model loaded before perf-check.
          # Poll /ready and /model-info; give the app extra time to load the
          # checkpoint if necessary.
          echo "Waiting for /ready and model to be loaded..."
          ok=0
          for i in $(seq 1 12); do
            echo "check #$i"
            status=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/ready || true)
            model_info=$(curl -sS http://127.0.0.1:8000/model-info || true)

            # Consider the model loaded if the model-info contains an explicit
            # model_loaded flag, or if it contains checkpoint/classes metadata.
            if [ "$status" = "200" ]; then
              if echo "$model_info" | grep -q '"model_loaded":true' || \
                 echo "$model_info" | grep -q '"checkpoint"' || \
                 echo "$model_info" | grep -q '"classes"'; then
                ok=1
                break
              fi
            fi

            sleep 5
          done

          if [ "$ok" != "1" ]; then
            echo "Service did not become ready with model loaded. Dumping /model-info and process status:" >&2
            curl -sS http://127.0.0.1:8000/model-info || true
            echo "--- process list ---" >&2
            ps -ef | sed -n '1,200p' || true
            echo "API pid:" $(cat api.pid) || true
            kill "$(cat api.pid)" || true
            exit 1
          fi

          bash scripts/smoke_test.sh http://127.0.0.1:8000
          python -m mlops.cli perf-check --endpoint http://127.0.0.1:8000 --sample-size 40
          kill "$(cat api.pid)"

      # The trained model is handed to the build job as an artifact rather than
      # retrained there, so the image contains exactly the weights that just passed
      # the gate and the smoke test.
      - name: Upload model and metrics
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            artifacts/model.pkl
            artifacts/model_card.md
            artifacts/metrics/
            artifacts/plots/
          retention-days: 30

      - name: Package submission zip (source, configs, artifacts)
        run: |
          set -e
          mkdir -p submission
          zip -r submission/mlops_assignment2_submission.zip \
            src docker k8s .github dvc.yaml dvc.lock requirements.txt requirements-dev.txt README.md artifacts mlruns || true

      - name: Upload submission
        uses: actions/upload-artifact@v4
        with:
          name: submission-zip
          path: submission/mlops_assignment2_submission.zip
          retention-days: 30

  image:
    name: Build and publish the image
    runs-on: ubuntu-latest
    needs: pipeline

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Download the trained model
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: artifacts

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry (use CR_PAT if set, else GITHUB_TOKEN)
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # Build a completely fresh image for CI/security validation.
      # no-cache ensures old Docker/GHA dependency layers cannot be reused.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true

      # Verify the freshly built image actually serves before it is published.
      # A container that fails its own health check must not become the "latest" tag.
      - name: Smoke test the image
        run: |
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -1)

          echo "Starting image: $IMAGE"

          docker run -d --name catsdogs -p 8000:8000 "$IMAGE"

          bash scripts/wait_for.sh http://127.0.0.1:8000/health 60
          curl -fsS http://127.0.0.1:8000/ready
          curl -fsS http://127.0.0.1:8000/model-info

          docker rm -f catsdogs

      # Scan the exact SHA-tagged image that was just built.
      # Do not use the :latest or :main registry image because those may refer
      # to an older published image.
      #
      # Trivy is run as a Docker container, so there is no need for `trivy clean`
      # on the GitHub runner.
      - name: Scan for vulnerabilities
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          IMAGE_LOWER=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')

          echo "Scanning $IMAGE_LOWER for vulnerabilities"

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --format table \
            --exit-code 1 \
            --ignore-unfixed \
            --severity CRITICAL,HIGH \
            "$IMAGE_LOWER"

      # Publish only after the fresh image passes:
      # 1. model quality gate
      # 2. API smoke test
      # 3. image smoke test
      # 4. vulnerability scan
      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
