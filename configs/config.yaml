# Configuration for the Cats vs Dogs MLOps project.
# Keep experiment-specific overrides in environment variables.

paths:
  data_dir: data
  raw_data_dir: data/raw
  processed_data_dir: data/processed
  model_path: artifacts/model.pkl
  metrics_dir: artifacts/metrics
  plots_dir: artifacts/plots
  model_card_path: artifacts/model_card.md
  dataset_lock_path: data/dataset.lock.json
  mlruns_dir: mlruns

model:
  type: mlp
  feature_size: 64
  mlp:
    hidden_layer_sizes: [512, 256]
    alpha: 0.0001

training:
  learning_rate: 0.0005
  epochs: 120
  batch_fraction: 1.0
  early_stopping_patience: 6

tracking:
  backend: auto              # auto | mlflow | file
  experiment_name: catsdogs
  registered_model_name: catsdogs-classifier
  mlflow_tracking_uri: file:./mlruns
  promote_min_accuracy: 0.60

serving:
  host: 0.0.0.0
  port: 8000
  model_version: local
  max_upload_bytes: 5242880
