# Immutable deployment stack used by CD on the MacBook Docker Desktop runner.
# It runs the exact image published by CI. It does not build locally or mount the
# host artifacts/data directories, so the deployed UI reflects the image itself.
name: mlops-catsdogs

services:
  api:
    image: ${IMAGE:?IMAGE must be set to the CI-published image}
    command: ["python", "-m", "mlops.cli", "serve-api", "--port", "8000"]
    ports: ["8000:8000"]
    environment:
      MLOPS_SERVING__MODEL_VERSION: ${TAG:-deployed}
      MLOPS_TRACKING__MLFLOW_TRACKING_URI: file:/app/mlruns
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  ui:
    image: ${IMAGE:?IMAGE must be set to the CI-published image}
    command: ["python", "-m", "mlops.cli", "serve-ui", "--port", "8501"]
    ports: ["8501:8501"]
    environment:
      MLOPS_UI__API_URL: http://api:8000
      MLOPS_UI__READ_ONLY: "true"
      MLOPS_DEPLOYMENT__IMAGE: ${IMAGE}
      MLOPS_MONITORING__KUBERNETES__ENABLED: "false"
      MLOPS_TRACKING__MLFLOW_TRACKING_URI: file:/app/mlruns
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  prometheus:
    image: prom/prometheus:v2.54.1
    ports: ["9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on: [api]
    restart: unless-stopped
