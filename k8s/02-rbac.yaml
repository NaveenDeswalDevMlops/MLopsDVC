# The dashboard reads pod logs so the monitoring panel works inside the cluster.
#
# It uses the Kubernetes API directly with this service account's token rather
# than shelling out to kubectl, which keeps a 50 MB binary and a second auth path
# out of the image. The Role is the narrowest that supports it: read-only, on pods
# and pod logs, in this namespace only. No write verbs, no cluster scope, no
# secrets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: catsdogs-ui
  namespace: mlops
  labels:
    app.kubernetes.io/part-of: mlops-catsdogs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: catsdogs-log-reader
  namespace: mlops
  labels:
    app.kubernetes.io/part-of: mlops-catsdogs
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: catsdogs-ui-log-reader
  namespace: mlops
  labels:
    app.kubernetes.io/part-of: mlops-catsdogs
subjects:
  - kind: ServiceAccount
    name: catsdogs-ui
    namespace: mlops
roleRef:
  kind: Role
  name: catsdogs-log-reader
  apiGroup: rbac.authorization.k8s.io
