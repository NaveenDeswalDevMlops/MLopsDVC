apiVersion: v1
kind: Service
metadata:
  name: catsdogs-ui
  namespace: mlops
  labels:
    app.kubernetes.io/name: catsdogs-ui
    app.kubernetes.io/part-of: mlops-catsdogs
spec:
  # NodePort so `minikube service catsdogs-ui -n mlops --url` opens it directly,
  # with no ingress controller to install first.
  type: NodePort
  selector:
    app.kubernetes.io/name: catsdogs-ui
  ports:
    - name: http
      port: 8501
      targetPort: http
      nodePort: 30851
