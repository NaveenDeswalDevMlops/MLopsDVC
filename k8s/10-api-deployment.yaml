apiVersion: apps/v1
kind: Deployment
metadata:
  name: catsdogs-api
  namespace: mlops
  labels:
    app.kubernetes.io/name: catsdogs-api
    app.kubernetes.io/part-of: mlops-catsdogs
    app.kubernetes.io/component: inference
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: catsdogs-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0      # never drop below the current replica count
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catsdogs-api
        app.kubernetes.io/part-of: mlops-catsdogs
        app.kubernetes.io/component: inference
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: mlops-catsdogs:local
          # minikube image load puts the image on the node, so pulling would fail.
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "mlops.cli", "serve-api", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: catsdogs-config
          # Three probes, three different questions.
          # startup: has the checkpoint finished loading? Guards the other two.
          # liveness: is the process wedged? /health never touches the model, so a
          #   missing checkpoint cannot cause a restart loop that can never fix it.
          # readiness: can this pod actually answer? /ready fails without a model,
          #   which removes the pod from the Service rather than killing it.
          startupProbe:
            httpGet: { path: /health, port: http }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 800m, memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: logs, mountPath: /app/logs }
            - { name: tmp,  mountPath: /tmp }
      volumes:
        # The root filesystem is read-only, so the two paths the process writes to
        # are explicit emptyDirs.
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
