apiVersion: apps/v1
kind: Deployment
metadata:
  name: catsdogs-ui
  namespace: mlops
  labels:
    app.kubernetes.io/name: catsdogs-ui
    app.kubernetes.io/part-of: mlops-catsdogs
    app.kubernetes.io/component: dashboard
spec:
  # One replica on purpose: the dashboard runs background jobs and holds their
  # state in memory, so a second replica would answer half the status polls with
  # "no such job".
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: catsdogs-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catsdogs-ui
        app.kubernetes.io/part-of: mlops-catsdogs
        app.kubernetes.io/component: dashboard
    spec:
      # Grants the pod the token the log collector uses to read pod logs.
      serviceAccountName: catsdogs-ui
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: mlops-catsdogs:local
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "mlops.cli", "serve-ui", "--port", "8501"]
          ports:
            - name: http
              containerPort: 8501
          envFrom:
            - configMapRef:
                name: catsdogs-config
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 800m, memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: logs,      mountPath: /app/logs }
            - { name: artifacts, mountPath: /app/artifacts/runs }
            - { name: tmp,       mountPath: /tmp }
      volumes:
        - name: logs
          emptyDir: {}
        - name: artifacts
          emptyDir: {}
        - name: tmp
          emptyDir: {}
