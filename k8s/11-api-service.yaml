apiVersion: v1
kind: Service
metadata:
  name: catsdogs-api
  namespace: mlops
  labels:
    app.kubernetes.io/name: catsdogs-api
    app.kubernetes.io/part-of: mlops-catsdogs
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: catsdogs-api
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30800
