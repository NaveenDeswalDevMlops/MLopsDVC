[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-catsdogs"
version = "1.0.0"
description = "End-to-end MLOps pipeline for cats-vs-dogs binary image classification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
mlops = "mlops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/mlops"]
omit = ["*/__init__.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = [
  "E501",  # long lines are caught by the formatter, not the linter
  "B008",  # Flask route decorators legitimately call functions in defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # sys.path has to be set before importing the package
